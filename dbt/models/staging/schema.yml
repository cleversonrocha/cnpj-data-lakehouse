  - name: stg_socios
    description: "Tabela de sócios de empresas."
    columns:
      - name: sk_id
        description: "Surrogate Key do sócio da empresa"        
        data_tests:
          - unique
          - not_null

      - name: cnpj_basico
        description: "Número base de inscrição no CNPJ (CADASTRO NACIONAL DA  PESSOA JURÍDICA)."        
        data_tests:
          - not_null
        
      - name: identificador
        description: "Código do identificador de sócio (1 - PESSOA JURÍDICA | 2 - PESSOA FÍSICA | 3 - ESTRANGEIRO)"        
        data_tests:
          - not_null
        
      - name: nome_razao_social
        description: "Nome do sócio pessoa física ou a razão social e/ou nome empresarial da pessoa jurídica e/ou nome do sócio/razão social do sócio estrangeiro."
                        
      - name: cpf_cnpj
        description: "CPF ou CNPJ do sócio (SÓCIO ESTRANGEIRO NÃO TEM ESTA INFORMAÇÃO)."        
        
      - name: qualificacao
        description: "Código da qualificação do sócio, referenciando a tabela de qualificações."
        data_tests:
          - not_null
                                  
      - name: data_entrada_sociedade
        description: "Data de entrada na sociedade."
              
      - name: pais
        description: "Código do país do sócio estrangeiro."
        
      - name: representante_legal
        description: "Número do CPF do representante legal."
        
      - name: nome_do_representante
        description: "Nome do representante legal."
        
      - name: qualificacao_representante
        description: "Código da qualificação do representante legal"
        
      - name: faixa_etaria_socio
        description: "Código correspondente à faixa etária do sócio."
        data_tests:
          - not_null
        
      - name: data_processamento
        description: "Data e hora do processamento dos dados."
        data_tests:
          - not_null
        
