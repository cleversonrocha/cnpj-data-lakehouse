version: 1

models:

  - name: bridge_empresas_socios
    description: "Relação many-to-many entre dim_empresas e dim_socios, no grão de estabelecimento."        
    constraints:
      - type: unique
        columns: [sk_empresa, sk_socio]
    columns:
      - name: sk_empresa
        description: "SK da empresa."
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_empresas')
                field: sk_id

      - name: sk_socio
        description: "SK do sócio."
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_socios')
                field: sk_id

      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null

  - name: bridge_estabelecimentos_cnaes
    description: "Relação many-to-many entre estabelecimentos e CNAEs"    
    constraints:
      - type: unique
        columns: [sk_estabelecimento,sk_cnae]
    columns:    
      - name: sk_estabelecimento
        description: "SK do estabelecimento."
        data_type: integer
        constraints:
          - type: not_null        
        data_tests:
          - relationships:
              arguments:
                to: ref('int_estabelecimentos')
                field: sk_id

      - name: sk_cnae
        description: "SK do CNAE."
        data_type: smallint        
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cnaes')
                field: sk_id      

      - name: tipo_cnae
        description: "PRINCIPAL ou SECUNDÁRIO"
        data_type: varchar
        constraints:
          - type: check
            expression: "tipo_cnae IN ('PRINCIPAL', 'SECUNDÁRIO')"

      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null                    

  - name: dim_cnaes
    description: "Dimensão de Classificação Nacional de Atividades Econômicas (CNAE)."
    columns:
      - name: sk_id
        description: "Surrogate Key"
        data_type: smallint
        constraints:
          - type: unique
          - type: not_null

      - name: codigo
        description: "Código CNAE"
        data_type: varchar
        constraints:
          - type: unique
          - type: not_null

      - name: codigo_formatado
        description: "Código CNAE formatado"
        data_type: varchar
        constraints:
          - type: unique
          - type: not_null

      - name: descricao
        description: "Descrição da atividade econômica."
        data_type: varchar
        constraints:
          - type: not_null

      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz
        constraints:
          - type: not_null

  - name: dim_empresas
    description: "Dimensão de empresas (matrizes) da Receita Federal."
    columns:
      - name: sk_id
        description: "SK da dim_empresas"
        data_type: integer
        constraints:
          - type: unique
          - type: not_null

      - name: cnpj_basico
        description: "Oito primeiros digítos do CNPJ."
        data_type: varchar
        constraints:
          - type: unique
          - type: not_null

      - name: capital_social
        description: "Capital social da empresa."
        data_type: decimal(15,2)
        constraints:
          - type: not_null 

      - name: razao_social
        description: "Razão social da empresa."
        data_type: varchar
        constraints:
          - type: not_null

      - name: natureza_juridica
        description: "Natureza jurídica da empresa."
        data_type: smallint
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_naturezas')
                field: codigo

      - name: descricao_natureza_juridica
        description: "Descricao da natureza jurídica da empresa."
        data_type: varchar
        constraints:
          - type: not_null

      - name: qualificacao_responsavel
        description: "Natureza jurídica da empresa."
        data_type: tinyint
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_qualificacoes')
                field: codigo

      - name: descricao_qualificacao_responsavel
        description: "Descrição da qualificação do responsável pela empresa."
        data_type: varchar
        constraints:
          - type: not_null

      - name: porte_empresa
        description: "Porte da empresa."
        data_type: tinyint
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_portes_empresas')
                field: codigo

      - name: descricao_porte_empresa
        description: "Natureza jurídica da empresa."
        data_type: varchar
        constraints:
          - type: not_null

      - name: ente_federativo_responsavel
        description: "Ente federativo responsável da empresa."
        data_type: smallint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_entes_federativos')
                field: codigo

      - name: descricao_ente_federativo_responsavel
        description: "Descrição do ente federativo da empresa."
        data_type: varchar
        
      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null          

  - name: dim_localidades
    description: "Localidades dos estabelecimentos"
    columns:
      - name: sk_id
        description: "Surrogate Key da dim_localidades (municipio,cidade_exterior,uf,pais)"
        data_type: integer
        constraints:
          - type: unique
          - type: not_null    

      - name: municipio
        description: "Código do município do logradouro."
        data_type: smallint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_municipios')
                field: codigo

      - name: descricao_municipio
        description: "Descrição do município do logradouro."
        data_type: varchar

      - name: cidade_exterior
        description: "Código da cidade do estabelecimento quando do exterior."
        data_type: smallint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_cidades_exterior')
                field: codigo

      - name: descricao_cidade_exterior
        description: "Cidade do estabelecimento quando do exterior."
        data_type: varchar

      - name: uf
        description: "Código da UF do município."
        data_type: tinyint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_ufs')
                field: codigo

      - name: descricao_uf
        description: "Sigla do estado do município ou cidade do exterior (EX)."
        data_type: varchar

      - name: regiao
        description: "Código da UF do município."
        data_type: tinyint       

      - name: descricao_regiao
        description: "Sigla do estado do município ou cidade do exterior (EX)."
        data_type: varchar

      - name: pais
        description: "Código do País da UF."
        data_type: smallint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_paises')
                field: codigo

      - name: descricao_pais
        description: "Descrição do País da UF."
        data_type: varchar

      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null

  - name: dim_socios
    description: "Dimensão de sócios das empresas."
    columns:
      - name: sk_id
        description: "Surrogate key da int_socios"
        data_type: integer
        constraints:
          - type: unique
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_socios')
                field: sk_id

      - name: cnpj_basico
        description: "Oito primeiros digítos do CNPJ."
        data_type: varchar
        constraints:
          - type: not_null

      - name: identificador
        description: "Identificador tipo pessoa Física/Jurídica/Estrangeiro."
        data_type: tinyint
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_tipos_pessoas')
                field: codigo

      - name: tipo_pessoa
        description: "Física/Jurídica/Estrangeiro."
        data_type: varchar

      - name: nome_razao_social
        description: "Nome/Razão Social do sócios."
        data_type: varchar
        
      - name: cpf_cnpj
        description: "Documento do sócio."
        data_type: varchar
        
      - name: qualificacao
        description: "Código da qualificação do sócio."
        data_type: tinyint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_qualificacoes')
                field: codigo

      - name: descricao_qualificacao
        description: "Descrição da qualificação do sócio."
        data_type: varchar

      - name: data_entrada_sociedade
        description: "Data de entrada na sociedade."
        data_type: date
      
      - name: pais
        description: "Código país do sócio."
        data_type: smallint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_paises')
                field: codigo

      - name: descricao_pais
        description: "Descrição do país do sócio."
        data_type: varchar

      - name: representante_legal
        description: "Documento do representante legal."
        data_type: varchar  

      - name: nome_do_representante
        description: "Nome do representante legal."
        data_type: varchar

      - name: qualificacao_representante
        description: "Código da qualificação do representante legal."
        data_type: tinyint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_qualificacoes')
                field: codigo

      - name: descricao_qualificacao_representante
        description: "Descrição da qualificação do representante."
        data_type: varchar

      - name: faixa_etaria_socio
        description: "Código da faixa etária do sócio."
        data_type: tinyint
        data_tests:
          - relationships:
              arguments:
                to: ref('int_faixas_etarias')
                field: codigo

      - name: descricao_faixa_etaria_socio
        description: "Descrição da faixa etária do sócios."
        data_type: varchar

      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null   

  - name: dim_tempo_entrada_sociedade
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas de entrada na sociedade dos sócios."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_tempo_entrada_sociedade')
                field: sk_id        

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date  
                
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint
        
      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint
        
      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        
  - name: dim_tempo_inicio_atividades
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas de início da atividade dos estabelecimentos."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_tempo_inicio_atividades')
                field: sk_id        

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date  
                
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint
        
      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint
        
      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        
  - name: dim_tempo_situacoes_cadastrais
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas da situação cadatral dos estabelecimentos."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_tempo_situacoes_cadastrais')
                field: sk_id        

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date  
                
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint
        
      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint
        
      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null

  - name: dim_tempo_situacoes_especiais
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas de situação especial dos estabelecimentos."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_tempo_situacoes_especiais')
                field: sk_id        

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date  
                
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint
        
      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint
        
      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null

  - name: fact_empresas
    description: "Tabela fato empresas."
    columns:
      - name: sk_empresa
        description: "Surrogate Key da fact_empresas."
        data_type: integer
        constraints:
          - type: unique
          - type: not_null
        data_tests:
          - relationships:
                arguments:
                  to: ref('dim_empresas')
                  field: sk_id

      - name: capital_social
        description: "Capital social da empresa."
        data_type: decimal(15,2)
        constraints:
          - type: not_null

      - name: qtd_estabelecimentos
        description: "Quantidade de estabelecimentos da empresa."
        data_type: smallint
        constraints:          
          - type: not_null

      - name: qtd_matrizes
        description: "Quantidade de matrizes da empresa."
        data_type: tinyint
        constraints:          
          - type: not_null                
          
      - name: qtd_filiais
        description: "Quantidade de filiais da empresa."
        data_type: smallint
        constraints:          
          - type: not_null

      - name: qtd_situacao_nulas
        description: "Quantidade de estabelecimentos nulos da empresa."
        data_type: smallint
        constraints:          
          - type: not_null

      - name: qtd_situacao_ativas
        description: "Quantidade de estabelecimentos ativos da empresa."
        data_type: smallint
        constraints:          
          - type: not_null

      - name: qtd_situacao_suspensas
        description: "Quantidade de estabelecimentos suspensos da empresa."
        data_type: smallint
        constraints:          
          - type: not_null

      - name: qtd_situacao_inaptas
        description: "Quantidade de estabelecimentos inaptos da empresa."
        data_type: smallint
        constraints:          
          - type: not_null

      - name: qtd_situacao_baixadas
        description: "Quantidade de estabelecimentos baixados da empresa."
        data_type: smallint
        constraints:          
          - type: not_null

      - name: qtd_socios
        description: "Quantidade de socios da empresa."
        data_type: smallint
        
      - name: qtd_socios_pf
        description: "Quantidade de socios to tipo pessoa física da empresa."
        data_type: smallint
        
      - name: qtd_socios_pj
        description: "Quantidade de socios to tipo pessoa jurídica da empresa."
        data_type: smallint
        
      - name: qtd_socios_estrangeiro
        description: "Quantidade de socios to estrangeiros da empresa."
        data_type: smallint
        
      - name: is_me
        description: "Flag binária para o porte do tipo ME da empresa."
        data_type: tinyint
        constraints:          
          - type: not_null

      - name: is_pp
        description: "Flag binária para o porte do tipo PP da empresa."
        data_type: tinyint
        constraints:          
          - type: not_null

      - name: is_demais
        description: "Flag binária para o porte do tipo DEMAIS da empresa."
        data_type: tinyint
        constraints:          
          - type: not_null  

      - name: is_simples
        description: "Flag binária para empres optante pelo SIMPLES NACIONAL."
        data_type: tinyint
        constraints:          
          - type: not_null

      - name: is_mei
        description: "Flag binária para o tipo de empresa que não é MEI."
        data_type: tinyint
        constraints:          
          - type: not_null

      - name: data_processamento
        description: "Data da processamento."
        data_type: timestamptz  
        constraints:
          - type: not_null       

  - name: fact_estabelecimentos
    description: "Tabela fato para estabelecimentos."
    columns:
    - name: sk_estabelecimento
      description: "SK da fact_estabelecimentos"
      data_type: integer
      constraints:
        - type: unique
        - type: not_null
      data_tests:
       - relationships:
            arguments:
              to: ref('int_estabelecimentos')
              field: sk_id

    - name: sk_empresa
      description: "SK da dim_empresas"
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('dim_empresas')
              field: sk_id

    - name: sk_tempo_inicio_atividade
      description: "SK da dim_tempo"
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('int_tempo_inicio_atividades')
              field: sk_id    

    - name: sk_tempo_situacoes_especiais
      description: "SK da dim_tempo"
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('int_tempo_situacoes_especiais')
              field: sk_id
    
    - name: sk_tempo_situacoes_cadastrais
      description: "SK da dim_tempo"
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('int_tempo_situacoes_cadastrais')
              field: sk_id

    - name: sk_localidades
      description: "SK da dim_localidades."
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('dim_localidades')
              field: sk_id

    - name: cnpj_completo
      description: "CNPJ completo com máscara."
      data_type: varchar
      constraints:
        - type: unique
        - type: not_null

    - name: descricao_matriz_filial
      description: "Descrição MATRIZ/FILIAL."
      data_type: varchar

    - name: nome_fantasia
      description: "Nome fantasia do estabelecimento."
      data_type: varchar   

    - name: situacao_cadastral
      description: "Descrição da situação cadatral."
      data_type: varchar

    - name: motivo_situacao_cadastral
      description: "Descrição do motivo da situação cadastral."
      data_type: varchar   

    - name: logradouro
      description: "Endereço do estabelecimento."
      data_type: varchar

    - name: numero
      description: "Número do endereço."
      data_type: varchar

    - name: complemento
      description: "Comeplemento do endereço."
      data_type: varchar

    - name: bairro
      description: "Bairro do endereço."
      data_type: varchar

    - name: cep
      description: "Códido de endereçamento postal."
      data_type: varchar       

    - name: telefone_1
      description: "Telefone com ddd."
      data_type: varchar
    
    - name: telefone_2
      description: "Telefone com ddd."
      data_type: varchar
    
    - name: fax
      description: "Fax com ddd."
      data_type: varchar

    - name: email
      description: "Endereço eletrônico."
      data_type: varchar

    - name: qtd_matrizes    
      description: "Quantidade de estabelecimentos do tipo MATRIZ para o SUM()."
      data_type: tinyint
      constraints:
        - type: not_null

    - name: qtd_filiais
      description: "Quantidade de estabelecimentos do tipo FILIAL para o SUM()."
      data_type: tinyint
      constraints:
        - type: not_null

    - name: qtd_nulas
      description: "Quantidade de estabelecimentos que estão com situação NULA para o SUM()."
      data_type: tinyint
      constraints:
        - type: not_null

    - name: qtd_ativas
      description: "Quantidade de estabelecimentos que estão com situação ATIVA para o SUM()."
      data_type: tinyint
      constraints:
        - type: not_null

    - name: qtd_suspensas
      description: "Quantidade de estabelecimentos que estão com situação SUSPENSA para o SUM()."
      data_type: tinyint  
      constraints:
        - type: not_null

    - name: qtd_inaptas
      description: "Quantidade de estabelecimentos que estão com situação INAPTA para o SUM()."
      data_type: tinyint  
      constraints:
        - type: not_null

    - name: qtd_baixadas
      description: "Quantidade de estabelecimentos que estão com situação BAIXADA para o SUM()."
      data_type: tinyint  
      constraints:
        - type: not_null

    - name: data_processamento
      description: "Data da processamento."
      data_type: timestamptz  
      constraints:
        - type: not_null

  - name: fact_socios
    description: "Fato dos sócios."
    columns:
      - name: sk_socio
        description: "Surrogate Key da fact_socios."
        data_type: integer
        constraints:
          - type: unique
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_socios')
                field: sk_id

      - name: sk_tempo_entrada_sociedade
        description: "Surrogate Key da dim_tipos_pessoas."
        data_type: integer
        constraints:          
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('int_tempo_entrada_sociedade')
                field: sk_id

      - name: is_pf
        description: "Flag binária para quantidade de sócios do tipo pessoa física."
        data_type: tinyint
        constraints:          
          - type: not_null

      - name: is_pj
        description: "Flag binária para quantidade de sócios do tipo pessoa jurídica."
        data_type: tinyint
        constraints:          
          - type: not_null

      - name: is_estrangeiro
        description: "Flag binária para quantidade de sócios estrangeiros."
        data_type: tinyint
        constraints:          
          - type: not_null

      - name: data_processamento
        description: "Data da processamento."
