version: 1

models:

  - name: dim_cnaes
    description: "Dimensão de Classificação Nacional de Atividades Econômicas (CNAE)."
    columns:
      - name: sk_id
        description: "Surrogate Key"
        data_type: integer
        constraints:
          - type: unique
          - type: not_null

      - name: codigo
        description: "Código CNAE"
        data_type: varchar
        constraints:
          - type: unique
          - type: not_null

      - name: codigo_formatado
        description: "Código CNAE formatado"
        data_type: varchar
        constraints:
          - type: unique
          - type: not_null

      - name: descricao
        description: "Descrição da atividade econômica."
        data_type: varchar
        constraints:
          - type: not_null

  - name: dim_tempo_inicio_atividade
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas de início de atividade dos estabelecimentos."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) da dimensão tempo, formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date
        
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint

      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint

      - name: dia
        description: "Número do dia (1 a 31)."
        data_type: tinyint

      - name: trimestre
        description: "Número do trimestre do ano (1 a 4)."
        data_type: tinyint

      - name: semestre
        description: "Número do semestre do ano (1 ou 2)."
        data_type: tinyint

      - name: dia_semana_numero
        description: "Dia da semana usando ISO (1 = Segunda-feira, 7 = Domingo)"
        data_type: tinyint

      - name: nome_mes
        description: "Nomes dos meses em Português."
        data_type: varchar

      - name: nome_dia_semana
        description: "Nome dos dias da semana em Português."
        data_type: varchar

  - name: dim_tempo_situacao_cadastral
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas da situação cadastral dos estabelecimentos."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) da dimensão tempo, formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date
        
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint

      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint

      - name: dia
        description: "Número do dia (1 a 31)."
        data_type: tinyint

      - name: trimestre
        description: "Número do trimestre do ano (1 a 4)."
        data_type: tinyint

      - name: semestre
        description: "Número do semestre do ano (1 ou 2)."
        data_type: tinyint

      - name: dia_semana_numero
        description: "Dia da semana usando ISO (1 = Segunda-feira, 7 = Domingo)"
        data_type: tinyint

      - name: nome_mes
        description: "Nomes dos meses em Português."
        data_type: varchar

      - name: nome_dia_semana
        description: "Nome dos dias da semana em Português."
        data_type: varchar

  - name: dim_tempo_situacao_especial
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas de situação especial dos estabelecimentos."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) da dimensão tempo, formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date
        
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint

      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint

      - name: dia
        description: "Número do dia (1 a 31)."
        data_type: tinyint

      - name: trimestre
        description: "Número do trimestre do ano (1 a 4)."
        data_type: tinyint

      - name: semestre
        description: "Número do semestre do ano (1 ou 2)."
        data_type: tinyint

      - name: dia_semana_numero
        description: "Dia da semana usando ISO (1 = Segunda-feira, 7 = Domingo)"
        data_type: tinyint

      - name: nome_mes
        description: "Nomes dos meses em Português."
        data_type: varchar

      - name: nome_dia_semana
        description: "Nome dos dias da semana em Português."
        data_type: varchar

  - name: dim_tempo_entrada_sociedade
    description: "Dimensão de tempo agregada a nível mensal, gerada a partir das datas de entrada em sociedade dos sócios."
    columns:
      - name: sk_id
        description: "Chave substituta (Surrogate Key) da dimensão tempo, formatada como número inteiro (YYYYMMDD)."
        data_type: integer  
        constraints:
          - type: unique
          - type: not_null

      - name: data_referencia
        description: "Data de referência correspondente à chave substituta."        
        data_type: date
        
      - name: ano
        description: "Ano correspondente à data."
        data_type: smallint

      - name: mes
        description: "Número do mês (1 a 12)."
        data_type: tinyint

      - name: dia
        description: "Número do dia (1 a 31)."
        data_type: tinyint

      - name: trimestre
        description: "Número do trimestre do ano (1 a 4)."
        data_type: tinyint

      - name: semestre
        description: "Número do semestre do ano (1 ou 2)."
        data_type: tinyint

      - name: dia_semana_numero
        description: "Dia da semana usando ISO (1 = Segunda-feira, 7 = Domingo)"
        data_type: tinyint

      - name: nome_mes
        description: "Nomes dos meses em Português."
        data_type: varchar

      - name: nome_dia_semana
        description: "Nome dos dias da semana em Português."
        data_type: varchar

  - name: dim_quadro_societario
    description: "Dimensão de sócios das empresas."
    columns:
      - name: sk_id
        description: "Surrogate key ROW_NUMBER() OVER()"
        data_type: integer
        constraints:
          - type: unique
          - type: not_null
          
      - name: cnpj_basico
        data_type: varchar
        constraints:
          - type: not_null

      - name: pessoa
        data_type: varchar
        constraints:
          - type: check
            expression: "pessoa IN ('PESSOA FÍSICA', 'PESSOA JURÍDICA', 'ESTRANGEIRO')"

      - name: nome_razao_social
        data_type: varchar
        
      - name: cpf_cnpj
        data_type: varchar
        
      - name: qualificacao_socio
        data_type: varchar
        constraints:
          - type: not_null      

      - name: pais_socio
        data_type: varchar
        
      - name: representante_legal
        data_type: varchar
        constraints:
          - type: not_null

      - name: nome_do_representante
        data_type: varchar
        
      - name: qualificacao_representante
        data_type: varchar
        constraints:
          - type: not_null

      - name: faixa_etaria_socio
        data_type: varchar
        constraints:
          - type: check
            expression: "faixa_etaria_socio IN ('0 a 12 anos',
                                                 '13 a 20 anos',
                                                 '21 a 30 anos',
                                                 '31 a 40 anos',
                                                 '41 a 50 anos',
                                                 '51 a 60 anos',
                                                 '61 a 70 anos',
                                                 '71 a 80 anos',
                                                 'maiores de 80 anos', 'não se aplica')"  

  - name: dim_estabelecimentos_empresas
    description: "Dimensão de estabelecimentos (matrizes e filiais) da Receita Federal."
    columns:
      - name: sk_id
        description: "SK da dim_estabelecimentos_empresas"
        data_type: integer
        constraints:
          - type: unique
          - type: not_null

      - name: cnpj_basico
        description: "Oito primeiros digítos do CNPJ."
        data_type: varchar
        
      - name: cnpj_completo
        description: "CNPJ completo do estabelecimento, formatado como XX.XXX.XXX/YYYY-ZZ."
        data_type: varchar

      - name: tipo_estabelecimento
        description: "MATRIZ ou FILIAL."
        data_type: varchar
        constraints:
          - type: check
            expression: "tipo_estabelecimento IN ('MATRIZ','FILIAL')"
              
      - name: nome_fantasia
        description: "Nome fantasia do estabelecimento."
        data_type: varchar      

      - name: situacao_cadastral
        description: "Descrição da situação cadastral."
        data_type: varchar
        constraints:
          - type: check
            expression: "situacao_cadastral IN ('NULA','ATIVA','SUSPENSA','INAPTA','BAIXADA')"
      
      - name: motivo_situacao_cadastral
        description: "Descrição do motivo da situação cadastral."
        data_type: varchar

      - name: situacao_especial
        description: "Descrição da situação especial."
        data_type: varchar

      - name: uf
        description: "Sigla da Unidade Federativa (Estado). Ex: SP, RJ, PR."
        data_type: varchar
        constraints:
          - type: not_null
        
      - name: desc_municipio
        description: "Nome descritivo do município. Para casos internacionais, armazena o nome da cidade no exterior."
        data_type: varchar
        constraints:
          - type: not_null
      
      - name: desc_pais
        description: "Nome descritivo do município. Para casos internacionais, armazena o nome da cidade no exterior."
        data_type: varchar

      - name: logradouro
        data_type: varchar

      - name: numero
        data_type: varchar

      - name: complemento
        data_type: varchar

      - name: bairro
        data_type: varchar

      - name: cep
        data_type: varchar
      
      - name: telefone_1
        data_type: varchar

      - name: telefone_2
        data_type: varchar

      - name: fax
        data_type: varchar

      - name: email
        data_type: varchar

      - name: razao_social
        description: "Razão social da empresa."
        data_type: varchar
        constraints:
          - type: not_null

      - name: porte
        description: "Porte da empresa."
        data_type: varchar
        constraints:
          - type: check
            expression: "porte IN ('NÃO INFORMADO', 'MICRO EMPRESA', 'EMPRESA DE PEQUENO PORTE', 'DEMAIS')"

      - name: porte_sigla
        description: "Sigla do porte da empresa."
        data_type: varchar
        constraints:
          - type: check
            expression: "porte_sigla IN ('NÃO INFORMADO', 'ME', 'EPP', 'DEMAIS')"

      - name: ente_federativo_responsavel
        description: "Ente federativo responsável, aplicável geralmente a órgãos e entidades da administração pública."
        data_type: varchar

      - name: capital_social
        description: "Valor correspondente ao capital social da empresa."
        data_type: decimal(15,2)

      - name: codigo_natureza_juridica
        description: "Código da natureza jurídica da empresa."
        data_type: varchar

      - name: natureza_juridica
        description: "Descrição da natureza jurídica da empresa."
        data_type: varchar

      - name: qualificacao_responsavel
        description: "Descrição da qualificação do responsável pela empresa."
        data_type: varchar

      - name: is_mei
        description: "Indicador do histórico e status de opção pelo MEI (Microempreendedor Individual)."
        data_type: varchar
        constraints:
        - type: check
          expression: "is_mei IN ('SIM','NÃO (EX-MEI)','NÃO','NÃO INFORMADO')"        

  - name: int_cnaes_principais
    description: "Tabela intermediária de CNAEs principais dos estabelecimentos."
    columns:
      - name: sk_estabelecimento_id
        description: "SK do estabelecimento."
        data_type: integer
        constraints:
          - type: unique
          - type: not_null        
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_estabelecimentos_empresas')
                field: sk_id

      - name: sk_cnae_id
        description: "SK do CNAE."        
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cnaes')
                field: sk_id
        constraints:
          - type: not_null

      - name: tipo_cnae
        description: "PRINCIPAL"
        data_type: varchar
        constraints:          
          - type: check
            expression: "tipo_cnae IN ('PRINCIPAL')"

  - name: int_cnaes_secundarias
    description: "Tabela intermediária de CNAEs secundários dos estabelecimentos."
    columns:
      - name: sk_estabelecimento_id
        description: "SK do estabelecimento."
        data_type: integer
        constraints:          
          - type: not_null        
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_estabelecimentos_empresas')
                field: sk_id

      - name: sk_cnae_id
        description: "SK do CNAE."  
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cnaes')
                field: sk_id
        constraints:
          - type: not_null

      - name: tipo_cnae
        description: "SECUNDÁRIO"
        data_type: varchar
        constraints:
          - type: check
            expression: "tipo_cnae IN ('SECUNDÁRIO')"

  - name: bridge_estabelecimentos_cnaes
    description: "Relação many-to-many entre estabelecimentos e CNAEs"    
    constraints:
      - type: unique
        columns: [sk_estabelecimento_id,sk_cnae_id]
    columns:    
      - name: sk_estabelecimento_id
        description: "SK do estabelecimento."
        data_type: integer
        constraints:
          - type: not_null        
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_estabelecimentos_empresas')
                field: sk_id

      - name: sk_cnae_id
        description: "SK do CNAE."
        data_type: integer        
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cnaes')
                field: sk_id      

      - name: tipo_cnae
        description: "PRINCIPAL ou SECUNDÁRIO"
        data_type: varchar
        constraints:
          - type: check
            expression: "tipo_cnae IN ('PRINCIPAL', 'SECUNDÁRIO')"              

  - name: bridge_empresas_socios
    description: "Relação many-to-many entre dim_estabelecimentos_empresas e dim_quadro_societario, no grão de estabelecimento."        
    constraints:
      - type: unique
        columns: [sk_estabelecimento_id, sk_socio_id]
    columns:
      - name: sk_estabelecimento_id
        description: "SK do estabelecimento."
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_estabelecimentos_empresas')
                field: sk_id

      - name: sk_socio_id
        description: "SK do sócio."
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_quadro_societario')
                field: sk_id

      - name: sk_data_entrada_sociedade
        description: "SK da dim_tempo_entrada_sociedade"
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tempo_entrada_sociedade')
                field: sk_id

  - name: fact_abertura_empresas
    description: "Tabela fato para aberturas de empresas."
    columns:
    - name: sk_id
      description: "SK da fact_abertura_empresas"
      data_type: integer
      constraints:
        - type: unique
        - type: not_null        
      
    - name: sk_data_inicio_atividade
      description: "SK da dim_tempo"
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('dim_tempo_inicio_atividade')
              field: sk_id

    - name: sk_data_situacao_cadastral
      description: "SK da dim_tempo"
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('dim_tempo_situacao_cadastral')
              field: sk_id

    - name: sk_data_situacao_especial
      description: "SK da dim_tempo"
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - relationships:
            arguments:
              to: ref('dim_tempo_situacao_especial')
              field: sk_id

    - name: qtd_estabelecimentos
      description: "Quantidade de estabelecimentos para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null   

    - name: qtd_matrizes
      description: "Quantidade de estabelecimentos do tipo MATRIZ para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_filiais
      description: "Quantidade de estabelecimentos do tipo FILIAL para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_ativas
      description: "Quantidade de estabelecimentos que estão com situação ATIVA para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_suspensas
      description: "Quantidade de estabelecimentos que estão com situação SUSPENSA para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_baixadas
      description: "Quantidade de estabelecimentos que estão com situação BAIXADA para o SUM()."
      data_type: smallint  
      constraints:
        - type: not_null

    - name: qtd_nulas
      description: "Quantidade de estabelecimentos que estão com situação NULA para o SUM()."
      data_type: smallint  
      constraints:
        - type: not_null

    - name: qtd_inaptas
      description: "Quantidade de estabelecimentos que estão com situação INAPTA para o SUM()."
      data_type: smallint  
      constraints:
        - type: not_null

    - name: qtd_porte_micro
      description: "Quantidade de estabelecimentos que são MICRO EMPRESA para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_porte_pequeno
      description: "Quantidade de estabelecimentos que são EMPRESA DE PEQUENO PORTE para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_porte_demais
      description: "Quantidade de estabelecimentos que são DEMAIS para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_nao_informado
      description: "Quantidade de estabelecimentos que são NÃO INFORMADO para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_mei
      description: "Quantidade de estabelecimentos que são MEI para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_ex_mei
      description: "Quantidade de estabelecimentos que deixaram de ser MEI para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null

    - name: qtd_nao_mei
      description: "Quantidade de estabelecimentos que não são MEI para o SUM()."
      data_type: smallint
      constraints:
        - type: not_null
