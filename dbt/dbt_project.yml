# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'cnpj_data_lakehouse'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'cnpj_data_lakehouse'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  cnpj_data_lakehouse:

on-run-end:
  - "COPY {{ ref('silver_cnaes') }} TO 's3://silver/cleaned/cnaes.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_empresas') }} TO 's3://silver/cleaned/empresas.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_estabelecimentos') }} TO 's3://silver/cleaned/estabelecimentos.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_motivos') }} TO 's3://silver/cleaned/motivos.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_municipios') }} TO 's3://silver/cleaned/municipios.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_naturezas') }} TO 's3://silver/cleaned/naturezas.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_paises') }} TO 's3://silver/cleaned/paises.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_qualificacoes') }} TO 's3://silver/cleaned/qualificacoes.parquet' (FORMAT PARQUET);"
  - "COPY {{ ref('silver_socios') }} TO 's3://silver/cleaned/socios.parquet' (FORMAT PARQUET);"
      